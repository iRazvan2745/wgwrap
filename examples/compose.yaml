# Build the images first:
#   wgwrap build nginx:latest -t nginx-wg
#   wgwrap build alpine:latest -t alpine-wg
# then: docker compose up -d
services:
  # A wrapped app: nginx reachable from WireGuard peers at its Address (10.8.0.2).
  web:
    image: nginx-wg
    cap_add: [NET_ADMIN]
    # user: "101"            # DON'T: use WGWRAP_USER instead, wgwrap needs to start as root
    environment:
      WG_WAIT_HANDSHAKE: 10s
    volumes:
      - ./wg0.conf:/etc/wireguard/wg0.conf:ro

  # Userspace mode (no wireguard kernel module on the host), full tunnel:
  app:
    image: alpine-wg
    command: ["sleep", "infinity"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
      net.ipv6.conf.default.disable_ipv6: 0
    environment:
      WG_MODE: userspace
    volumes:
      - ./wg0-full.conf:/etc/wireguard/wg0.conf:ro

  # Sidecar: one wrapped container holds the tunnel, unwrapped images join its
  # network namespace and get the same wg0, routes, kill switch and DNS.
  vpn:
    image: alpine-wg
    command: ["sleep", "infinity"]
    cap_add: [NET_ADMIN]
    volumes:
      - ./wg0.conf:/etc/wireguard/wg0.conf:ro
    # sleep only runs once the tunnel is fully set up, so this gates the sidecars.
    healthcheck:
      test: ["CMD", "pidof", "sleep"]
      interval: 2s
      start_period: 30s
  redis:
    image: redis:alpine     # stock image, no wgwrap needed; no cap_add either
    network_mode: service:vpn
    depends_on:
      vpn: { condition: service_healthy, restart: true }
  # Ports of sidecars are published on the vpn service, not on the sidecar.
