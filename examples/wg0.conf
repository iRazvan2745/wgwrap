# Split tunnel: only the VPN subnet goes through WireGuard, everything else uses
# the container's normal network. Replace the keys and endpoint with your own.
[Interface]
PrivateKey = <this container's private key>
Address = 10.8.0.2/24
# DNS = 10.8.0.1, corp.internal   # optional: rewrites /etc/resolv.conf

[Peer]
PublicKey = <server public key>
Endpoint = vpn.example.com:51820
AllowedIPs = 10.8.0.0/24, 192.168.50.0/24
PersistentKeepalive = 25
