# Full tunnel: all egress goes through the peer.
# Run with --sysctl net.ipv4.conf.all.src_valid_mark=1.
# Note: replies to ports published with -p also go into the tunnel; see the README.
[Interface]
PrivateKey = <this container's private key>
Address = 10.8.0.2/32, fd08::2/128
DNS = 10.8.0.1

[Peer]
PublicKey = <server public key>
Endpoint = vpn.example.com:51820
AllowedIPs = 0.0.0.0/0, ::/0
PersistentKeepalive = 25
