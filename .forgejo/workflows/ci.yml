# Lint, unit tests and a vulnerability scan on every push and PR, then the Docker
# end-to-end suite. Each fc-* job is its own Firecracker VM with its own Docker.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }} # mise.toml uses exec(), which needs trust

jobs:
  check:
    runs-on: fc-2vcpu-4gb
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - uses: https://github.com/jdx/mise-action@v2 # installs the Go version pinned in mise.toml
      - run: mise run lint ::: test
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  integration:
    runs-on: fc-4vcpu-8gb
    needs: check
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - uses: https://github.com/jdx/mise-action@v2
      # Pull through the daemon (and the runner's Docker Hub mirror) first: when
      # `imagetools inspect` is rate-limited, wgwrap falls back to the local store.
      - name: Pre-pull base images
        run: |
          for i in alpine:latest nginx:latest ghcr.io/nginx/nginx-unprivileged:latest gcr.io/distroless/static:nonroot; do
            docker pull -q "$i"
          done
      # Without the wireguard module in the VM kernel, kernel-mode tests skip and
      # the rest runs in userspace mode.
      - run: mise run integration
